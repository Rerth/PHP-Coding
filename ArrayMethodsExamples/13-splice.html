<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - splice</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>splice()</h1>
    <p>Changes the array by removing or replacing elements.</p>
    <pre><code>const numbers = [1, 2, 3, 4];
numbers.splice(1, 2);</code></pre>
    <script>
      const numbers = [1, 2, 3, 4];
      numbers.splice(1, 2);
      console.log(numbers);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - findIndex</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>findIndex()</h1>
    <p>Returns the index of the first matching element.</p>
    <pre><code>const fruits = ['apple', 'banana', 'cherry'];
const index = fruits.findIndex((fruit) => fruit === 'banana');</code></pre>
    <script>
      const fruits = ['apple', 'banana', 'cherry'];
      const index = fruits.findIndex((fruit) => fruit === 'banana');
      console.log(index);
    </script>
  </body>
</html>

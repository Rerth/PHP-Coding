<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - find</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>find()</h1>
    <p>Returns the first element that matches a condition.</p>
    <pre><code>const numbers = [10, 20, 30];
const found = numbers.find((n) => n > 15);</code></pre>
    <script>
      const numbers = [10, 20, 30];
      const found = numbers.find((n) => n > 15);
      console.log(found);
    </script>
  </body>
</html>

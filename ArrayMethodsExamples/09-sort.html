<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - sort</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>sort()</h1>
    <p>Sorts array items in place.</p>
    <pre><code>const fruits = ['banana', 'apple', 'cherry'];
fruits.sort();</code></pre>
    <script>
      const fruits = ['banana', 'apple', 'cherry'];
      fruits.sort();
      console.log(fruits);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - slice</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>slice()</h1>
    <p>Returns a copied portion of the array.</p>
    <pre><code>const numbers = [1, 2, 3, 4];
const part = numbers.slice(1, 3);</code></pre>
    <script>
      const numbers = [1, 2, 3, 4];
      const part = numbers.slice(1, 3);
      console.log(part);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - concat</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>concat()</h1>
    <p>Combines two or more arrays into a new array.</p>
    <pre><code>const a = [1, 2];
const b = [3, 4];
const c = a.concat(b);</code></pre>
    <script>
      const a = [1, 2];
      const b = [3, 4];
      const c = a.concat(b);
      console.log(c);
    </script>
  </body>
</html>

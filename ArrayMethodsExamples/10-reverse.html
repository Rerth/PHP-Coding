<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - reverse</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>reverse()</h1>
    <p>Reverses the order of array items.</p>
    <pre><code>const numbers = [1, 2, 3];
numbers.reverse();</code></pre>
    <script>
      const numbers = [1, 2, 3];
      numbers.reverse();
      console.log(numbers);
    </script>
  </body>
</html>

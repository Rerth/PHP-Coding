<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Methods - every</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>every()</h1>
    <p>Checks if every item matches a condition.</p>
    <pre><code>const ages = [18, 20, 25];
const allAdults = ages.every((age) => age >= 18);</code></pre>
    <script>
      const ages = [18, 20, 25];
      const allAdults = ages.every((age) => age >= 18);
      console.log(allAdults);
    </script>
  </body>
</html>

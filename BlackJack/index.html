<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twenty-One | Blackjack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="table-felt">
    <div class="vignette"></div>

    <header class="scoreboard">
      <div class="brand">
        <span class="brand-suit">♠</span>
        <h1>Twenty-One</h1>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Bankroll</span>
          <span class="stat-value" id="bankroll">$1000</span>
        </div>
        <div class="stat">
          <span class="stat-label">Bet</span>
          <span class="stat-value" id="current-bet">$0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Round</span>
          <span class="stat-value" id="round-count">00</span>
        </div>
      </div>
    </header>

    <section class="seat dealer-seat">
      <div class="seat-label">
        <span>Dealer</span>
        <span class="hand-total" id="dealer-total">—</span>
      </div>
      <div class="card-row" id="dealer-cards"></div>
    </section>

    <div class="table-divider">
      <span></span>
      <p id="message">Place your bet to begin</p>
      <span></span>
    </div>

    <section class="seat player-seat">
      <div class="card-row" id="player-cards"></div>
      <div class="seat-label">
        <span>You</span>
        <span class="hand-total" id="player-total">—</span>
      </div>
    </section>

    <footer class="controls">
      <div class="chip-rack" id="chip-rack">
        <button class="chip" data-value="25">$25</button>
        <button class="chip" data-value="50">$50</button>
        <button class="chip" data-value="100">$100</button>
        <button class="chip" data-value="250">$250</button>
        <button class="chip chip-clear" id="clear-bet">Clear</button>
      </div>

      <div class="action-rack" id="action-rack">
        <button class="btn btn-deal" id="deal-btn">Deal</button>
        <button class="btn btn-hit" id="hit-btn" disabled>Hit</button>
        <button class="btn btn-stand" id="stand-btn" disabled>Stand</button>
        <button class="btn btn-double" id="double-btn" disabled>Double</button>
        <button class="btn btn-next" id="next-btn" style="display:none;">Next Round</button>
      </div>
    </footer>
  </div>

<script src="index.js"></script>
</body>
</html>

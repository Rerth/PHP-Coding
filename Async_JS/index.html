<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Async JavaScript Examples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      line-height: 1.6;
    }

    button {
      margin-right: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.6rem 1rem;
      border: 1px solid #333;
      border-radius: 4px;
      cursor: pointer;
    }

    pre {
      padding: 1rem;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 720px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Async JavaScript: Promises & Async/Await</h1>

  <section>
    <h2>Promise Example</h2>
    <button id="promiseBtn">Run Promise Example</button>
    <pre id="promiseOutput"></pre>
  </section>

  <section>
    <h2>Async/Await Example</h2>
    <button id="asyncAwaitBtn">Run Async/Await Example</button>
    <pre id="asyncAwaitOutput"></pre>
  </section>

  <script src="async-helpers.js"></script>
  <script src="promises.js"></script>
  <script src="async-await.js"></script>
</body>
</html>
